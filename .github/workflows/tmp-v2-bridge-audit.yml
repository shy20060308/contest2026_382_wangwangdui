name: Temporary V2 Bridge Migration

on:
  push:
    branches:
      - refactor/v2-remove-compat-bridges-20260912
  workflow_dispatch:

permissions:
  contents: write

jobs:
  migrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/v2-remove-compat-bridges-20260912
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: quickapp/velaclaw-aiot/package-lock.json
      - name: Migrate compatibility bridge imports
        working-directory: quickapp/velaclaw-aiot
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import shutil

          replacements = {
              'v2/design/specs/workout_history': 'v2/design/apps/workout/history',
              'v2/design/specs/workout_select': 'v2/design/apps/workout/selection',
              'v2/design/views/workout_selection': 'v2/design/apps/workout/selection_view',
              'v2/design/views/workout_history': 'v2/design/apps/workout/history_view',
              'v2/design/specs/watchface_selector': 'v2/design/apps/faces',
              'v2/design/views/watchface_selector': 'v2/design/apps/faces/view',
              'v2/design/views/settings_brightness': 'v2/design/apps/brightness/view',
              'v2/design/views/settings_vibration': 'v2/design/apps/vibration/view',
              'v2/design/specs/notification_demo': 'v2/design/apps/notification',
              'v2/design/views/notification': 'v2/design/apps/notification/view',
              'v2/design/specs/settings_menu': 'v2/design/apps/settings',
              'v2/design/views/settings_menu': 'v2/design/apps/settings/view',
              'v2/design/views/diagnostics': 'v2/design/apps/diagnostics/view',
              'v2/design/specs/activity': 'v2/design/apps/steps',
              'v2/design/views/activity': 'v2/design/apps/steps/view',
              'v2/design/specs/launcher': 'v2/design/apps/launcher',
              'v2/design/views/launcher': 'v2/design/apps/launcher/view',
              'v2/design/specs/workout': 'v2/design/apps/workout',
              'v2/design/views/workout': 'v2/design/apps/workout/view',
              'v2/design/specs/clock': 'v2/design/apps/clock',
              'v2/design/views/clock': 'v2/design/apps/clock/view',
              'v2/design/views/health': 'v2/design/apps/heart/view',
              'v2/design/views/history': 'v2/design/apps/history/view',
              'v2/design/views/motion': 'v2/design/apps/motion/view',
              'v2/design/views/sync': 'v2/design/apps/sync/view',
              'v2/design/specs/today': 'v2/design/apps/today',
              'v2/design/views/today': 'v2/design/apps/today/view',
          }

          for base in (Path('src/pages'), Path('test')):
              for file in base.rglob('*'):
                  if file.suffix not in ('.js', '.ux'):
                      continue
                  source = file.read_text(encoding='utf-8')
                  updated = source
                  for old, new in replacements.items():
                      updated = updated.replace(old, new)
                  if updated != source:
                      file.write_text(updated, encoding='utf-8')

          settings_targets = {
              'src/pages/settings/brightness/brightness.ux': 'brightness',
              'src/pages/settings/vibration/vibration.ux': 'vibration',
              'src/pages/settings/motion/motion.ux': 'motion',
              'src/pages/settings/diagnostics/diagnostics.ux': 'diagnostics',
              'src/pages/settings/bluetooth/bluetooth.ux': 'sync',
          }
          for name, app in settings_targets.items():
              file = Path(name)
              source = file.read_text(encoding='utf-8')
              source = source.replace('v2/design/specs/settings_detail', 'v2/design/apps/' + app)
              file.write_text(source, encoding='utf-8')

          architecture = Path('test/v2_architecture.test.js')
          source = architecture.read_text(encoding='utf-8')
          source = source.replace("const clockDesign = read('src/v2/design/apps/clock.js')", "const clockDesign = read('src/v2/design/apps/clock/layout.js')")
          marker = "  assert.ok(dependsOn(source, '/v2/'), relative + ' must enter the V2 application architecture')\n"
          guard = "  assert.ok(!dependsOn(source, '/design/specs/') && !dependsOn(source, '/design/views/'), relative + ' must import authoritative app-owned Design modules directly')\n"
          if guard not in source:
              if marker not in source:
                  raise SystemExit('architecture insertion marker not found')
              source = source.replace(marker, marker + guard, 1)
          architecture.write_text(source, encoding='utf-8')

          declarative = Path('test/v2_declarative_adapter.test.js')
          source = declarative.read_text(encoding='utf-8')
          source = source.replace(
              "assert.ok(!exists('src/v2/design/specs/simple_center.js'), 'unused generic screenshot helper should be removed')",
              "assert.ok(!exists('src/v2/design/specs') && !exists('src/v2/design/views'), 'v2.3 compatibility bridge directories should stay removed')"
          )
          declarative.write_text(source, encoding='utf-8')

          shutil.rmtree('src/v2/design/specs')
          shutil.rmtree('src/v2/design/views')
          PY
          echo '--- remaining routed page bridge imports ---'
          if grep -RInE "v2/design/(specs|views)" src/pages; then
            echo 'Legacy bridge imports remain in routed pages.' >&2
            exit 1
          fi
          test ! -d src/v2/design/specs
          test ! -d src/v2/design/views
      - name: Install dependencies
        working-directory: quickapp/velaclaw-aiot
        run: npm ci
      - name: Run full V2 contracts
        working-directory: quickapp/velaclaw-aiot
        run: npm run check
      - name: Build JSC package
        working-directory: quickapp/velaclaw-aiot
        run: npm run build
      - name: Commit validated migration
        shell: bash
        run: |
          rm .github/workflows/tmp-v2-bridge-audit.yml
          git diff --check
          git status --short
          git diff --stat
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "refactor(v2): remove compatibility design bridges"
          git push origin HEAD:refactor/v2-remove-compat-bridges-20260912
