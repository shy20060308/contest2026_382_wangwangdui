name: Temporary V2 Rect Display Integration

on:
  push:
    branches:
      - fix/v2-rect-display-20260912
  workflow_dispatch:

permissions:
  contents: write

jobs:
  integrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/v2-rect-display-20260912
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: quickapp/velaclaw-aiot/package-lock.json
      - name: Apply rect integration
        working-directory: quickapp/velaclaw-aiot
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          # Today: Rect uses the same pageIndex owner as Circle instead of cramming
          # summary + calendar into a single surface.
          today = Path('src/pages/today/today.ux')
          source = today.read_text(encoding='utf-8')
          start_marker = '      <div class="rect-surface" if="{{ ready && isRect }}"'
          if start_marker in source:
              start = source.index(start_marker)
              tail_marker = '      </div>\n    </stack>\n  </stack>\n</template>'
              tail = source.index(tail_marker, start)
              end = tail + len('      </div>')
              rect_template = '''      <div class="rect-surface" if="{{ ready && isRect && pageIndex === 0 }}" style="left: {{ sceneSafeLeft }}px; top: {{ sceneSafeTop }}px; height: {{ sceneSafeHeight }}px;">
        <div class="rect-date-card"><div class="rect-date"><text class="rect-day">{{ dayText }}</text><text class="rect-month">{{ monthText }}</text></div><div class="rect-copy"><text class="rect-weekday">{{ weekdayText }}</text><text class="rect-lunar">{{ lunarText }}</text></div><text class="rect-goal">{{ goalPercent }}%</text></div>
        <div class="rect-goal-row"><text class="rect-summary-title">今日摘要</text><text class="rect-goal-copy">目标 {{ goalPercent }}%</text></div>
        <div class="rect-goal-track"><div class="rect-goal-fill" style="width: {{ goalWidth }};"></div></div>
        <div class="rect-summary-grid">
          <div class="rect-summary-row"><div class="rect-summary-card blue"><text class="rect-card-label">步数</text><text class="rect-card-value rect-step-value">{{ stepsText }}</text><text class="rect-card-unit">步</text></div><div class="rect-summary-card orange rect-card-right"><text class="rect-card-label">热量</text><text class="rect-card-value">{{ caloriesText }}</text><text class="rect-card-unit">千卡</text></div></div>
          <div class="rect-summary-row rect-row-bottom"><div class="rect-summary-card red"><text class="rect-card-label">心率</text><text class="rect-card-value">{{ heartText }}</text><text class="rect-card-unit">bpm</text></div><div class="rect-summary-card green rect-card-right"><text class="rect-card-label">站立</text><text class="rect-card-value">{{ standText }}</text><text class="rect-card-unit">小时</text></div></div>
        </div>
        <div class="rect-action" @click="openCalendar"><text class="rect-action-text">打开月历</text></div>
      </div>

      <div class="rect-surface" if="{{ ready && isRect && pageIndex === 1 }}" style="left: {{ sceneSafeLeft }}px; top: {{ sceneSafeTop }}px; height: {{ sceneSafeHeight }}px;">
        <div class="rect-calendar-head"><div class="rect-nav" @click="previousMonth"><text class="rect-nav-text">‹</text></div><text class="rect-calendar-title">{{ calendarTitle }}</text><div class="rect-nav" @click="nextMonth"><text class="rect-nav-text">›</text></div></div>
        <div class="rect-week-row"><text class="rect-week">日</text><text class="rect-week">一</text><text class="rect-week">二</text><text class="rect-week">三</text><text class="rect-week">四</text><text class="rect-week">五</text><text class="rect-week">六</text></div>
        <div class="rect-calendar-grid"><div class="rect-cell" for="{{ calendarCells }}" tid="key"><text class="rect-cell-text" style="color: {{ $item.textColor }}; background-color: {{ $item.backgroundColor }};">{{ $item.day }}</text></div></div>
        <div class="rect-action rect-calendar-back" @click="closeCalendar"><text class="rect-action-text">返回今日摘要</text></div>
      </div>'''
              source = source[:start] + rect_template + source[end:]

          css_start = source.index('.rect-surface {')
          css_end = source.index('</style>', css_start)
          rect_css = '''.rect-surface { position: absolute; width: 164px; flex-direction: column; align-items: center; }
.rect-date-card { width: 164px; height: 40px; border-radius: 12px; background-color: #15171B; flex-direction: row; align-items: center; }
.rect-date { width: 54px; height: 40px; flex-direction: row; align-items: center; justify-content: center; } .rect-day { font-size: 27px; color: #FFFFFF; font-weight: bold; } .rect-month { font-size: 7px; color: #FF375F; margin-left: 3px; margin-top: 10px; }
.rect-copy { width: 76px; flex-direction: column; } .rect-weekday { font-size: 10px; color: #FFFFFF; font-weight: bold; } .rect-lunar { font-size: 6px; color: #8E8E93; margin-top: 2px; } .rect-goal { width: 28px; font-size: 11px; color: #30D158; text-align: center; font-weight: bold; }
.rect-goal-row { width: 158px; height: 14px; margin-top: 4px; flex-direction: row; justify-content: space-between; align-items: center; } .rect-summary-title { font-size: 8px; color: #FFFFFF; font-weight: bold; } .rect-goal-copy { font-size: 7px; color: #30D158; }
.rect-goal-track { width: 158px; height: 4px; border-radius: 2px; background-color: #242426; } .rect-goal-fill { height: 4px; border-radius: 2px; background-color: #30D158; }
.rect-summary-grid { width: 158px; height: 81px; margin-top: 6px; flex-direction: column; }
.rect-summary-row { width: 158px; height: 38px; flex-direction: row; justify-content: center; } .rect-row-bottom { margin-top: 5px; }
.rect-summary-card { width: 76px; height: 38px; border-radius: 10px; flex-direction: column; justify-content: center; align-items: center; } .rect-card-right { margin-left: 6px; }
.rect-card-label { width: 68px; font-size: 6px; color: #8E8E93; text-align: center; } .rect-card-value { width: 68px; font-size: 13px; color: #FFFFFF; font-weight: bold; text-align: center; lines: 1; } .rect-step-value { font-size: 11px; } .rect-card-unit { width: 68px; font-size: 5px; color: #636366; text-align: center; }
.rect-action { width: 86px; height: 22px; margin-top: 5px; border-radius: 11px; background-color: #222226; justify-content: center; align-items: center; } .rect-action-text { width: 78px; font-size: 7px; color: #FF375F; text-align: center; }
.rect-calendar-head { width: 164px; height: 22px; flex-direction: row; justify-content: space-between; align-items: center; } .rect-calendar-title { width: 112px; font-size: 10px; color: #FFFFFF; font-weight: bold; text-align: center; } .rect-nav { width: 24px; height: 22px; justify-content: center; align-items: center; } .rect-nav-text { font-size: 16px; color: #FF375F; }
.rect-week-row, .rect-calendar-grid { width: 154px; flex-direction: row; flex-wrap: wrap; } .rect-week-row { height: 12px; } .rect-week { width: 22px; font-size: 6px; color: #8E8E93; text-align: center; }
.rect-calendar-grid { height: 114px; } .rect-cell { width: 22px; height: 19px; justify-content: center; align-items: center; } .rect-cell-text { width: 18px; height: 17px; border-radius: 8px; font-size: 7px; text-align: center; }
.rect-calendar-back { margin-top: 6px; }
'''
          source = source[:css_start] + rect_css + source[css_end:]
          today.write_text(source, encoding='utf-8')

          # Clock: expose the existing analog projection to a Rect-specific component.
          clock = Path('src/pages/clock/clock.ux')
          source = clock.read_text(encoding='utf-8')
          import_marker = '<import name="dashboardrect" src="../../components/watchfaces/dashboard_rect.ux"></import>\n'
          analog_import = '<import name="mechanicalrect" src="../../components/watchfaces/mechanical_rect.ux"></import>\n'
          if analog_import not in source:
              source = source.replace(import_marker, import_marker + analog_import)
          if '<mechanicalrect if="{{ faceId === \'mechanical\' }}"' not in source:
              lines = source.splitlines(True)
              for idx, line in enumerate(lines):
                  if '<dashboardrect if="{{ faceId === \'dashboard\' }}"' in line:
                      analog_line = '        <mechanicalrect if="{{ faceId === \'mechanical\' }}" onopen-today="openToday" onopen-health="openHealth" display-month="{{ displayMonth }}" display-date="{{ displayDate }}" battery-percent="{{ batteryPercent }}" current-heart-rate="{{ currentHeartRate }}" analog-ticks="{{ analogTicks }}" hour-hand-transform="{{ hourHandTransform }}" minute-hand-transform="{{ minuteHandTransform }}" second-hand-transform="{{ secondHandTransform }}"></mechanicalrect>\n'
                      lines.insert(idx + 1, analog_line)
                      break
              source = ''.join(lines)
          clock.write_text(source, encoding='utf-8')

          # Honeycomb: preserve tap semantics but recapture drag much earlier than the
          # later 6px regression, and render the first captured frame immediately.
          honey = Path('src/v2/design/engines/honeycomb.js')
          source = honey.read_text(encoding='utf-8')
          if 'var DRAG_CAPTURE_DISTANCE = 3\n' not in source:
              source = source.replace('var DRAG_DAMPING = 0.92\n', 'var DRAG_DAMPING = 0.92\nvar DRAG_CAPTURE_DISTANCE = 3\n')
          if 'DRAG_CAPTURE_DISTANCE: DRAG_CAPTURE_DISTANCE' not in source:
              source = source.replace('  DRAG_DAMPING: DRAG_DAMPING,\n', '  DRAG_DAMPING: DRAG_DAMPING,\n  DRAG_CAPTURE_DISTANCE: DRAG_CAPTURE_DISTANCE,\n')
          honey.write_text(source, encoding='utf-8')

          launcher = Path('src/pages/applist/applist.ux')
          source = launcher.read_text(encoding='utf-8')
          move_start = source.index('  onHoneyMove(event) {')
          move_end = source.index('  onHoneyEnd(event) {', move_start)
          new_move = '''  onHoneyMove(event) {
    if (!this.circleTouchActive || !event.touches || !event.touches[0]) return
    var p = event.touches[0]
    var now = Date.now()
    var totalX = p.pageX - this.touchStartX
    var totalY = p.pageY - this.touchStartY
    var wasDragging = this.dragMoved
    if (!this.dragMoved && (Math.abs(totalX) > honeycomb.DRAG_CAPTURE_DISTANCE || Math.abs(totalY) > honeycomb.DRAG_CAPTURE_DISTANCE)) this.dragMoved = true
    if (!this.dragMoved) { this.touchLastX = p.pageX; this.touchLastY = p.pageY; this.touchLastAt = now; return }
    if (event.preventDefault) event.preventDefault()
    if (event.stopPropagation) event.stopPropagation()
    var dx = wasDragging ? p.pageX - this.touchLastX : totalX
    var dy = wasDragging ? p.pageY - this.touchLastY : totalY
    var dt = Math.max(8, now - (this.touchLastAt || now))
    this.touchLastX = p.pageX; this.touchLastY = p.pageY; this.touchLastAt = now
    var pan = honeycomb.nextPan(this.circleSlots, this.circlePanX, this.circlePanY, dx, dy)
    this.circlePanX = pan.x; this.circlePanY = pan.y
    this.circleVelocityX = this.circleVelocityX * 0.45 + (dx / dt) * 0.55
    this.circleVelocityY = this.circleVelocityY * 0.45 + (dy / dt) * 0.55
    if (!wasDragging) this.renderHoneycomb()
    else this.scheduleHoneycombLayout()
  },
'''
          source = source[:move_start] + new_move + source[move_end:]
          launcher.write_text(source, encoding='utf-8')

          # Extend existing regression tests instead of adding another test runner.
          test = Path('test/text_fit_regressions.test.js')
          source = test.read_text(encoding='utf-8')
          if "const today = require('../src/v2/design/apps/today')" not in source:
              source = source.replace("const faces = require('../src/v2/design/apps/faces')\n", "const faces = require('../src/v2/design/apps/faces')\nconst today = require('../src/v2/design/apps/today')\nconst launcher = require('../src/v2/design/apps/launcher')\nconst clockDesign = require('../src/v2/design/apps/clock')\nconst honeycomb = require('../src/v2/design/engines/honeycomb')\n")
          marker = "console.log('Text-fit regressions verified: readable History cards, compact corners and long-value-safe watchfaces')"
          checks = '''
const todayPage = read('src/pages/today/today.ux')
const clockPage = read('src/pages/clock/clock.ux')
const sportRect = read('src/components/watchfaces/sport_rect.ux')
const simpleRect = read('src/components/watchfaces/simple_rect.ux')
const dashboardRect = read('src/components/watchfaces/dashboard_rect.ux')
const mechanicalRect = read('src/components/watchfaces/mechanical_rect.ux')
assert.strictEqual(today.layout.rect.surface, today.layout.circle.surface, 'Rect Today must share Circle summary/calendar page flow')
assert.ok(todayPage.includes('isRect && pageIndex === 0') && todayPage.includes('isRect && pageIndex === 1'), 'Rect Today must keep summary and calendar as separate pages owned by pageIndex')
assert.ok(todayPage.includes('rect-summary-grid') && todayPage.includes('openCalendar') && todayPage.includes('closeCalendar'), 'Rect Today must expose readable 2x2 summary cards and reuse shared calendar actions')
assert.strictEqual(launcher.layout.rect.surface, 'honeycomb', 'Rect launcher must reuse the Circle honeycomb surface')
assert.ok(clockDesign.layout.rect.faceIds.includes('mechanical'), 'Rect Clock must expose the mechanical face')
assert.ok(faces.layout.rect.faceIds.includes('mechanical'), 'Rect watchface selector must expose the mechanical face')
assert.ok(clockPage.includes('mechanical_rect.ux') && clockPage.includes('<mechanicalrect'), 'Rect Clock must mount the Rect mechanical component')
assert.ok(mechanicalRect.includes('analogTicks') && mechanicalRect.includes('hourHandTransform') && mechanicalRect.includes('minuteHandTransform'), 'Rect mechanical face must reuse the single Clock analog projection')
assert.ok(sportRect.includes('border-radius: 10px;') && simpleRect.includes('border-radius: 10px;') && dashboardRect.includes('border-radius: 10px;'), 'Rect digital faces must keep compact card corners')
assert.ok(honeycomb.DRAG_CAPTURE_DISTANCE <= 4, 'Honeycomb drag capture must stay responsive without stealing taps')

'''
          if checks.strip() not in source:
              source = source.replace(marker, checks + marker)
          test.write_text(source, encoding='utf-8')

          honey_test = Path('test/honeycomb_layout.test.js')
          source = honey_test.read_text(encoding='utf-8')
          old = "  assert.ok(honeycomb.ELASTIC_RANGE <= 0.1)\n"
          new = old + "  assert.ok(honeycomb.DRAG_CAPTURE_DISTANCE <= 4)\n"
          if 'honeycomb.DRAG_CAPTURE_DISTANCE <= 4' not in source:
              source = source.replace(old, new)
          honey_test.write_text(source, encoding='utf-8')
          PY
          git diff --check
      - name: Install dependencies
        working-directory: quickapp/velaclaw-aiot
        run: npm ci
      - name: Run full V2 contracts
        working-directory: quickapp/velaclaw-aiot
        run: npm run check
      - name: Build JSC package
        working-directory: quickapp/velaclaw-aiot
        run: npm run build
      - name: Commit validated integration
        shell: bash
        run: |
          rm .github/workflows/tmp-v2-rect-display.yml
          git diff --check
          git status --short
          git diff --stat
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "fix(rect): integrate Today paging, analog face and honeycomb touch"
          git push origin HEAD:fix/v2-rect-display-20260912
