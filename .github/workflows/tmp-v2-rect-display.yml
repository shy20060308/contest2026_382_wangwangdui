name: Temporary V2 Rect Display Integration

on:
  push:
    branches:
      - fix/v2-rect-display-20260912
  workflow_dispatch:

permissions:
  contents: write

jobs:
  integrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/v2-rect-display-20260912
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: quickapp/velaclaw-aiot/package-lock.json
      - name: Apply rect integration
        working-directory: quickapp/velaclaw-aiot
        run: python scripts/tmp_rect_integration.py
      - name: Check patch hygiene
        run: git diff --check
      - name: Install dependencies
        working-directory: quickapp/velaclaw-aiot
        run: npm ci
      - name: Run full V2 contracts
        working-directory: quickapp/velaclaw-aiot
        run: npm run check
      - name: Build JSC package
        working-directory: quickapp/velaclaw-aiot
        run: npm run build
      - name: Commit validated integration
        shell: bash
        run: |
          rm .github/workflows/tmp-v2-rect-display.yml
          rm quickapp/velaclaw-aiot/scripts/tmp_rect_integration.py
          git diff --check
          git status --short
          git diff --stat
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "fix(rect): integrate Today paging, analog face and honeycomb touch"
          git push origin HEAD:fix/v2-rect-display-20260912
