name: Temporary V2 Real History Check

on:
  push:
    branches:
      - fix/v2-real-history-data-20260912
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: quickapp/velaclaw-aiot
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: quickapp/velaclaw-aiot/package-lock.json
      - run: npm ci
      - run: npm run check
      - run: npm run build
