name: Temporary V2 Rect Rework

on:
  push:
    branches:
      - fix/v2-rect-display-20260912
  workflow_dispatch:

permissions:
  contents: write

jobs:
  validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/v2-rect-display-20260912
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: quickapp/velaclaw-aiot/package-lock.json
      - name: Apply square-screen rework
        run: python .github/tmp_rect_rework.py
      - name: Install dependencies
        working-directory: quickapp/velaclaw-aiot
        run: npm ci
      - name: Run full contracts
        working-directory: quickapp/velaclaw-aiot
        run: npm run check
      - name: Build JSC package
        working-directory: quickapp/velaclaw-aiot
        run: npm run build
      - name: Commit validated rework
        shell: bash
        run: |
          rm .github/tmp_rect_rework.py
          rm .github/workflows/tmp-v2-rect-rework.yml
          git diff --check
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "fix(rect): fill square pages and decouple analog face"
          git push origin HEAD:fix/v2-rect-display-20260912
