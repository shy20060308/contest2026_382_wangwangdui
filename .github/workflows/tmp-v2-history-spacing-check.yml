name: Temporary V2 History Spacing Check

on:
  push:
    branches:
      - fix/v2-history-card-spacing

jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: quickapp/velaclaw-aiot
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: quickapp/velaclaw-aiot/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Run V2 contracts
        run: npm run check
      - name: Build QuickApp
        run: npm run build
